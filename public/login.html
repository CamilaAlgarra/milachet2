<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milachet - Mi cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;600&family=Galindo&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="announcement-bar">
        CREACIONES HECHAS A MANO CON AMOR Y DEDICACIÓN
    </div>

    <header class="main-header">
        <div class="header-logo">
            <a href="index.html"><img src="assets/img/milachet_letras.png" alt="Logo de Milachet"></a>
        </div>
        <nav class="main-nav">
            <ul class="menu">
                <li><a href="index.html" class="menu-link">Inicio</a></li>
                <li><a href="sobre.html" class="menu-link">Sobre nosotros</a></li>
                <li><a href="productos.html" class="menu-link">Productos</a></li>
                <li><a href="contacto.html" class="menu-link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section id="login" class="main-section">
        <div class="section-title-wrapper">
            <h2>Mi cuenta</h2>
        </div>

        <p id="mensaje-auth"></p>

        <!-- INICIAR SESIÓN -->
        <form id="form-login" class="contacto-form">
            <fieldset>
                <legend>Iniciar sesión</legend>

                <div class="form-group">
                    <label for="login-email">Correo:</label>
                    <input type="email" id="login-email" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-hero">Entrar</button>
                </div>
            </fieldset>
        </form>

        <!-- CREAR CUENTA -->
        <form id="form-registro" class="contacto-form" hidden>
            <fieldset>
                <legend>Crear cuenta</legend>

                <div class="form-group">
                    <label for="registro-nombre">Nombre:</label>
                    <input type="text" id="registro-nombre" required>
                </div>

                <div class="form-group">
                    <label for="registro-email">Correo:</label>
                    <input type="email" id="registro-email" required>
                </div>

                <div class="form-group">
                    <label for="registro-password">Contraseña (mínimo 6 caracteres):</label>
                    <input type="password" id="registro-password" minlength="6" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-hero">Crear mi cuenta</button>
                </div>
            </fieldset>
        </form>
    </section>

    <footer>
        <p class="instagram-text">
            Síguenos en Instagram:
            <a href="https://www.instagram.com/milachett/" target="_blank">@milachett</a>
        </p>
        <p>&copy; 2026 Milachet. Todos los derechos reservados.</p>
    </footer>

    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>

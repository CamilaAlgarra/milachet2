<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milachet - Mi perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;400;600&family=Galindo&family=Satisfy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="announcement-bar">
        CREACIONES HECHAS A MANO CON AMOR Y DEDICACIÓN
    </div>

    <header class="main-header">
        <div class="header-logo">
            <a href="index.html"><img src="assets/img/milachet_letras.png" alt="Logo de Milachet"></a>
        </div>
        <nav class="main-nav">
            <ul class="menu">
                <li><a href="index.html" class="menu-link">Inicio</a></li>
                <li><a href="sobre.html" class="menu-link">Sobre nosotros</a></li>
                <li><a href="productos.html" class="menu-link">Productos</a></li>
                <li><a href="contacto.html" class="menu-link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section id="perfil" class="main-section">

        <!-- 1. SALUDO -->
        <div class="section-title-wrapper">
            <h2 id="perfil-titulo">Mi perfil</h2>
        </div>

        <!-- 2. PEDIDOS -->
        <h3 id="pedidos-titulo" style="font-family: var(--fuente-titulo);">Mis pedidos</h3>
        <div id="lista-pedidos" class="sobre-grid"></div>

        <!-- 3. DATOS -->
        <p id="mensaje-perfil" style="margin-top: 40px;"></p>

        <form id="form-perfil" class="contacto-form">
            <fieldset>
                <legend id="perfil-legend">Mis datos</legend>

                <div class="form-group">
                    <label for="perfil-email">Correo:</label>
                    <input type="email" id="perfil-email" disabled>
                </div>

                <div class="form-group">
                    <label for="perfil-nombre">Nombre:</label>
                    <input type="text" id="perfil-nombre" required>
                </div>

                <div class="form-group">
                    <label for="perfil-telefono">Teléfono:</label>
                    <input type="tel" id="perfil-telefono" placeholder="Ej: 3001234567">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-hero">Guardar cambios</button>
                </div>
            </fieldset>
        </form>
    </section>

    <footer>
        <p class="instagram-text">
            Síguenos en Instagram:
            <a href="https://www.instagram.com/milachett/" target="_blank">@milachett</a>
        </p>
        <p>&copy; 2026 Milachet. Todos los derechos reservados.</p>
    </footer>

    <script src="auth.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
